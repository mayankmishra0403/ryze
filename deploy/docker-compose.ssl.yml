# RYZE — HTTPS override. Use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.ssl.yml up -d --build
# Requirements before first run (on the VPS):
#   1. Point your domain A record at the VPS IP.
#   2. Generate certs:  certbot certonly --nginx -d __DOMAIN__ --email you@example.com
#   3. Replace __DOMAIN__ in nginx-ssl.conf.
# This file mounts nginx-ssl.conf (which replaces the HTTP-only nginx.conf mount at
# /etc/nginx/conf.d/default.conf) and exposes port 443.

services:
  web:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
